# Release - 推送 v* tag 时触发发布。
#
# 流程：tag -> GoReleaser 自动创建 GitHub Release + 构建全平台产物 +
# 校验和文件，全部挂到对应 Release 下；同时构建多架构 Docker 镜像
# 推送到 GHCR（ghcr.io/vod-studio/lolly）。
#
# 触发示例：
#   git tag v0.5.0
#   git push origin v0.5.0
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  # GoReleaser 需要 contents:write 来创建 Release 和上传产物。
  contents: write
  # GHCR 镜像发布需要 packages:write。
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # GoReleaser 生成 changelog 需要完整 git 历史。
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Export GOVERSION
        # goreleaser 的 ldflags 里用 {{.Env.GOVERSION}} 注入 Go 版本，
        # 但 goreleaser 不会自动读取 `go env GOVERSION`，需在环境里显式提供。
        run: echo "GOVERSION=$(go env GOVERSION)" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # 锁定 v2 主线，避免 v3 未来 breaking change 突然中断发布。
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 与 release 并行：镜像构建不依赖二进制产物，两者独立。
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Short SHA
        # Dockerfile 用短 commit 注入 version.GitCommit。
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # 多架构构建需要 QEMU 模拟 arm64。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        # 按 semver 自动生成标签：0.5.0 / 0.5 / 0 / latest，
        # 并附带 OCI 标准 label（source/revision/created 等）。
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/vod-studio/lolly
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Lolly
            org.opencontainers.image.description=High-performance HTTP server / reverse proxy

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ env.SHORT_SHA }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_TIME=${{ steps.meta.outputs.date }}
